<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament Arena | The Eras Showdown</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Trebuchet MS", Arial, sans-serif; background: var(--background, #fff0f6); color: var(--text, #75435f); }
a { color: inherit; }
button, input, select { font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
#theme-decorations { pointer-events: none; }
.page { max-width: 94rem; margin: auto; padding: 1.5rem clamp(1rem, 3vw, 3rem) 4rem; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.back { display: inline-block; padding: .6rem 1rem; border-radius: 2rem; background: var(--secondary, #f5c7db); text-decoration: none; font-weight: bold; }
.theme-control { display: flex; align-items: center; gap: .6rem; }
.theme-control select { padding: .5rem; border-radius: .6rem; border: 2px solid var(--accent, #8554a5); background: white; color: #29232d; }
h1 { text-align: center; font-size: clamp(2rem, 5vw, 3.6rem); margin: 2rem 0 .25rem; }
.intro { text-align: center; margin: 0 0 2rem; }
.panel { padding: clamp(1rem, 3vw, 2rem); background: #fffffff0; color: #302639; border-radius: 1.4rem; box-shadow: 0 6px 24px #0002; }
#tournament-setup { max-width: 52rem; margin: auto; text-align: center; }
#tournament-size, .tournament-field input { border: 2px solid #b994d2; border-radius: .6rem; padding: .65rem; background: white; color: #302639; }
#tournament-size { display: block; margin: .5rem auto 1.25rem; }
.tournament-fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .75rem; text-align: left; }
.tournament-field { display: grid; gap: .25rem; font-weight: bold; }
.tournament-field input { min-width: 0; width: 100%; }
.tournament-actions { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: center; margin-top: 1.4rem; }
.tournament-action, .bracket-reset { padding: .75rem 1rem; border: 2px solid var(--accent,#8554a5); background: var(--accent,#8554a5); color: #fff; border-radius: .8rem; font-weight: bold; }
.bracket-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.bracket-board { display: flex; align-items: stretch; gap: 2rem; overflow-x: auto; padding: 1.25rem .3rem 2rem; }
.bracket-round { flex: 0 0 14.5rem; display: flex; flex-direction: column; min-width: 0; }
.bracket-round h3, .bracket-champion h3 { text-align: center; margin: 0 0 1rem; }
.bracket-round-games { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 1.2rem; }
.bracket-match { display: grid; gap: .25rem; position: relative; border: 1px solid #c9b6d3; border-radius: .75rem; padding: .35rem; background: #faf7fc; }
.bracket-match::after { content: ""; position: absolute; top: 50%; left: 100%; width: 2rem; border-top: 2px solid #b994d2; }
.bracket-player { border: 1px solid transparent; border-radius: .4rem; padding: .65rem .4rem; min-height: 3rem; background: white; color: #302639; text-align: left; overflow-wrap: anywhere; }
.bracket-player:not(:disabled):hover { border-color: #8554a5; background: #efe2f7; }
.bracket-player:disabled { cursor: default; opacity: .65; }
.bracket-player.is-winner { border-color: #8554a5; background: #e3d1f0; color: #38234d; font-weight: bold; opacity: 1; }
.bracket-champion { flex: 0 0 13rem; display: flex; flex-direction: column; justify-content: center; }
.bracket-champion-name { padding: 1.4rem .7rem; border: 2px solid #c99b42; border-radius: .85rem; text-align: center; background: #fff9e9; color: #57401f; font-weight: bold; overflow-wrap: anywhere; }
@media (max-width: 36rem) { .tournament-fields { grid-template-columns: 1fr; } .bracket-round { flex-basis: 12rem; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* Mirrored tournament bracket: first rounds at the edges, final at center. */
.bracket-board-double {
  min-height: 30rem;
  align-items: stretch;
  gap: 1.25rem;
}
.bracket-wing {
  display: flex;
  flex: 1 0 auto;
  gap: 1.25rem;
  align-items: stretch;
}
.bracket-wing-left { justify-content: flex-end; }
.bracket-wing-right { justify-content: flex-start; }
.bracket-board-double .bracket-round {
  flex: 0 0 12rem;
}
.bracket-board-double .bracket-round-games {
  min-height: 24rem;
}
.bracket-board-double .bracket-match::after {
  width: 1.25rem;
}
.bracket-board-double .bracket-right .bracket-match::after {
  left: auto;
  right: 100%;
}
.bracket-center {
  flex: 0 0 13rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  gap: .7rem;
}
.bracket-center h3 { margin: 0; }
.bracket-center .bracket-final::after { display: none; }
.bracket-center .champion-title { margin-top: 1rem; }
.bracket-board-double .bracket-player { font-size: .9rem; }
@media (max-width: 55rem) {
  .bracket-board-double { gap: .8rem; }
  .bracket-wing { gap: .8rem; }
  .bracket-board-double .bracket-round { flex-basis: 10.5rem; }
}


/* Compact mirrored bracket: all 16 slots fit on typical desktop widths. */
.page { max-width: 100%; padding-inline: clamp(.65rem, 1.6vw, 1.5rem); }
.panel { padding: clamp(.7rem, 1.4vw, 1.4rem); }
.bracket-board-double { gap: clamp(.25rem, .65vw, .65rem); }
.bracket-wing { gap: clamp(.25rem, .65vw, .65rem); min-width: 0; }
.bracket-board-double .bracket-round {
  flex: 0 0 clamp(6.5rem, 10.7vw, 10.8rem);
}
.bracket-center { flex: 0 0 clamp(7.5rem, 12vw, 11.5rem); }
.bracket-board-double .bracket-player {
  font-size: clamp(.69rem, .78vw, .83rem);
  padding: .38rem .35rem;
  min-height: 2.35rem;
  line-height: 1.2;
}
.bracket-board-double .bracket-match { padding: .25rem; }
.bracket-board-double .bracket-round h3, .bracket-center h3 { font-size: clamp(.77rem, .95vw, 1rem); }
.bracket-board-double .bracket-match::after { width: clamp(.25rem, .65vw, .65rem); }
.bracket-board-double .bracket-champion-name { padding: .85rem .35rem; font-size: .85rem; }
@media (max-width: 820px) {
  .bracket-board-double .bracket-round { flex-basis: 8.5rem; }
  .bracket-center { flex-basis: 9rem; }
  .bracket-board-double .bracket-player { font-size: .75rem; }
}


/* Album-responsive tournament palette, derived from themeManager CSS variables. */
:root {
  --arena-ink: var(--text, #75435f);
  --arena-edge: var(--accent, #e7548f);
  --arena-soft: var(--secondary, #f5c7db);
  --arena-alt: var(--secondaryAccent, #a7d8f0);
}
.panel {
  background: color-mix(in srgb, var(--background, #fff0f6) 78%, var(--arena-soft) 22%);
  color: var(--arena-ink);
  border: 1px solid color-mix(in srgb, var(--arena-edge) 38%, transparent);
}
#tournament-size, .tournament-field input, .theme-control select {
  border-color: var(--arena-edge);
}
.tournament-action, .bracket-reset {
  background: var(--arena-soft);
  color: var(--arena-ink);
  border-color: var(--arena-edge);
}
.bracket-match {
  background: color-mix(in srgb, var(--background, #fff0f6) 72%, var(--arena-soft) 28%);
  border-color: color-mix(in srgb, var(--arena-edge) 55%, transparent);
}
.bracket-player {
  background: color-mix(in srgb, var(--background, #fff0f6) 90%, white 10%);
  color: var(--arena-ink);
}
.bracket-player:not(:disabled):hover {
  background: color-mix(in srgb, var(--arena-alt) 42%, var(--background, #fff0f6));
  border-color: var(--arena-edge);
}
.bracket-player.is-winner {
  background: var(--arena-soft);
  color: var(--arena-ink);
  border-color: var(--arena-edge);
}
.bracket-board-double .bracket-match::after { border-top-color: var(--arena-edge); }
.bracket-champion-name {
  background: var(--arena-soft);
  border-color: var(--arena-edge);
  color: var(--arena-ink);
}
.back { background: var(--arena-soft); color: var(--arena-ink); }


/* Winner/position accents must follow the era, never the old purple palette. */
#tournament-app .bracket-board-double .bracket-player.is-winner {
  background: var(--secondary, #f5c7db) !important;
  color: var(--text, #75435f) !important;
  border-color: var(--accent, #e7548f) !important;
  box-shadow: inset 0 0 0 1px var(--accent, #e7548f);
}
#tournament-app .bracket-board-double .bracket-player:focus-visible,
#tournament-app .bracket-board-double .bracket-player:not(:disabled):hover {
  outline-color: var(--accent, #e7548f);
  border-color: var(--accent, #e7548f);
}
#tournament-app .bracket-board-double .bracket-match {
  border-color: var(--accent, #e7548f);
}
#tournament-app .bracket-board-double .bracket-match::after {
  border-top-color: var(--accent, #e7548f);
}

</style>
</head>
<body>
<div id="theme-decorations" aria-hidden="true"></div>
<div class="page">
  <div class="topbar">
    <a class="back" href="./index.html">← Back to home</a>
    <div class="theme-control"><label for="theme-test-select">Era:</label>
      <select id="theme-test-select">
        <option value="debut">Debut</option><option value="fearless">Fearless</option>
        <option value="speakNow">Speak Now</option><option value="red">Red</option>
        <option value="nineteenEightyNine">1989</option><option value="reputation">reputation</option>
        <option value="lover">Lover</option><option value="folklore">folklore</option>
        <option value="evermore">evermore</option><option value="midnights">Midnights</option>
        <option value="ttpd">The Tortured Poets Department</option><option value="tloas">The Life of a Showgirl</option>
      </select>
    </div>
  </div>
  <h1>Tournament Arena</h1>
  <p class="intro">Your favorites. Head to head. One champion.</p>
  <main id="tournament-app" class="panel">
    <form id="tournament-setup">
      <h2>Build Your Own Showdown</h2>
      <p>Enter your contestants or jump into a tournament featuring all 12 eras.</p>
      <label for="tournament-size">Number of contestants</label>
      <select id="tournament-size">
        <option value="4">4</option><option value="8" selected>8</option><option value="16">16</option>
      </select>
      <div id="tournament-fields" class="tournament-fields"></div>
      <div class="tournament-actions">
        <button class="tournament-action" type="submit">Start custom tournament</button>
        <button class="tournament-action" type="button" id="tournament-eras">Play all 12 eras</button>
      </div>
      <p id="tournament-message" role="status"></p>
    </form>
    <div id="tournament-bracket" aria-live="polite"></div>
  </main>
</div>
<script type="module" src="./js/main.js?v=outside6"></script>
</body>
</html>
